  <rect x="695" y="198" width="105" height="60" fill="#6b4a31"/><rect x="710" y="183" width="75" height="15" fill="#7c5838"/><rect x="695" y="198" width="105" height="10" fill="#8e6847"/>
  <rect x="715" y="220" width="18" height="38" fill="#27363a"/><rect x="760" y="218" width="20" height="18" fill="#f0d987" opacity=".78"/>
