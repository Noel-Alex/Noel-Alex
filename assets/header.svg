 <rect x="714" y="264" width="22" height="21" fill="#9a6333"/><rect x="714" y="269" width="22" height="3" fill="#c28a45"/><rect x="723" y="270" width="5" height="6" fill="#d0b06a"/>
 <rect x="665" y="263" width="18" height="22" fill="#8d6847"/><rect x="669" y="267" width="4" height="4" fill="#b38a60"/><rect x="677" y="275" width="4" height="4" fill="#62432d"/>
 <rect x="864" y="205" width="96" height="80" fill="#59646a"/>
 <rect x="878" y="219" width="68" height="66" fill="url(#cave)"/>
 <rect x="864" y="205" width="14" height="80" fill="#778287"/><rect x="946" y="205" width="14" height="80" fill="#454f55"/>
 <rect x="878" y="205" width="68" height="14" fill="#68747a"/>
 <rect x="891" y="267" width="43" height="4" fill="#5e4838"/><rect x="895" y="271" width="3" height="14" fill="#8f7456"/><rect x="927" y="271" width="3" height="14" fill="#8f7456"/>
 <rect class="railglint" x="893" y="266" width="39" height="1" fill="#e2e8e3"/>
