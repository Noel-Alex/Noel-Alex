  <rect x="874" y="224" width="7" height="7" fill="#69d4cf"/><rect x="893" y="239" width="7" height="7" fill="#69d4cf"/><rect x="906" y="215" width="6" height="6" fill="#d85a4f"/>
  <rect class="glint" x="873" y="223" width="9" height="9" fill="none" stroke="#d7fffb" stroke-width="1"/>
