<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Noel Alex — Minecraft-inspired engineering profile</title>
<desc id="desc">A looping pixel-art dusk scene: Noel leaves a detailed workshop, walks to an ore block, mines it, collects the drop, then heads into a torch-lit mine before the scene resets.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
.cloud1{animation:cloud1 28s linear infinite}.cloud2{animation:cloud2 36s linear infinite}
.smoke1{animation:smoke 4.6s ease-out infinite}.smoke2{animation:smoke 4.6s ease-out 2.3s infinite}
.torch{animation:flicker .9s steps(2,end) infinite}.window{animation:window 3.2s steps(2,end) infinite}
.star{animation:twinkle 3.7s steps(2,end) infinite}.cursor{animation:blink 1.1s steps(2,end) infinite}
.player-motion{animation:playerPath 18s linear infinite}
.player-bob{animation:bob .34s steps(2,end) infinite}
.pickaxe{transform-box:fill-box;transform-origin:8px 24px;animation:swing .72s ease-in-out infinite}
.toolvis{animation:toolvis 18s steps(1,end) infinite}
.ore{animation:ore 18s steps(1,end) infinite}.crack1{animation:crack1 18s steps(1,end) infinite}.crack2{animation:crack2 18s steps(1,end) infinite}.crack3{animation:crack3 18s steps(1,end) infinite}
.drop{animation:drop 18s steps(1,end) infinite}.railglint{animation:railglint 2.8s steps(3,end) infinite}
@keyframes cloud1{from{transform:translateX(-45px)}to{transform:translateX(110px)}}
@keyframes cloud2{from{transform:translateX(55px)}to{transform:translateX(-105px)}}
@keyframes smoke{0%{opacity:0;transform:translate(0,0)}18%{opacity:.42}100%{opacity:0;transform:translate(18px,-45px)}}
@keyframes flicker{50%{opacity:.68;transform:translateY(1px)}} @keyframes window{50%{opacity:.72}}
@keyframes twinkle{50%{opacity:.25}} @keyframes blink{50%{opacity:0}}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes playerPath{
0%,7%{transform:translateX(0);opacity:1}
19%,52%{transform:translateX(92px);opacity:1}
64%{transform:translateX(150px);opacity:1}
77%{transform:translateX(212px);opacity:1}
82%{transform:translateX(232px);opacity:.15}
83%,92%{transform:translateX(232px);opacity:0}
93%{transform:translateX(0);opacity:0}
100%{transform:translateX(0);opacity:1}}
@keyframes toolvis{0%,18%{opacity:0}19%,52%{opacity:1}53%,100%{opacity:0}}
@keyframes swing{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(36deg)}}
@keyframes ore{0%,42%{opacity:1}43%,92%{opacity:0}93%,100%{opacity:1}}
@keyframes crack1{0%,26%{opacity:0}27%,31%{opacity:1}32%,100%{opacity:0}}
@keyframes crack2{0%,31%{opacity:0}32%,36%{opacity:1}37%,100%{opacity:0}}
@keyframes crack3{0%,36%{opacity:0}37%,42%{opacity:1}43%,100%{opacity:0}}
@keyframes drop{0%,42%{opacity:0;transform:translateY(0)}43%{opacity:1;transform:translateY(-12px)}50%{opacity:1;transform:translateY(0)}53%,100%{opacity:0;transform:translateY(0)}}
@keyframes railglint{0%,70%,100%{opacity:.25}84%{opacity:1}}
@media(prefers-reduced-motion:reduce){.cloud1,.cloud2,.smoke1,.smoke2,.torch,.window,.star,.cursor,.player-motion,.player-bob,.pickaxe,.toolvis,.ore,.crack1,.crack2,.crack3,.drop,.railglint{animation:none}.toolvis,.crack1,.crack2,.crack3,.drop{opacity:0}}
</style>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#102536"/><stop offset=".6" stop-color="#1b3540"/><stop offset="1" stop-color="#27433f"/></linearGradient>
 <linearGradient id="cave" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11191c"/><stop offset="1" stop-color="#050a0d"/></linearGradient>
 <radialGradient id="torchGlow"><stop offset="0" stop-color="#ffd67a" stop-opacity=".32"/><stop offset="1" stop-color="#ffd67a" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1000" height="400" fill="url(#sky)"/>
<rect x="12" y="12" width="976" height="376" fill="none" stroke="#8ea67d" stroke-width="2"/>
<g fill="#dce5ca" opacity=".75">
 <rect class="star" x="76" y="48" width="3" height="3"/><rect class="star" x="163" y="79" width="2" height="2"/>
 <rect class="star" x="555" y="50" width="3" height="3"/><rect class="star" x="631" y="88" width="2" height="2"/>
 <rect class="star" x="824" y="58" width="3" height="3"/><rect class="star" x="949" y="90" width="2" height="2"/>
</g>
