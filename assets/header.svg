<text x="42" y="309" fill="#9fb58d" font-size="13">WORLD  // VIT VELLORE · B.TECH CSE (DATA SCIENCE) · CLASS OF 2027</text>
<text x="42" y="334" fill="#c5cfba" font-size="13">CURRENT BIOMES  // EVIDENCE-GROUNDED AI · RUST SYSTEMS · LANGUAGE MODELS</text>
