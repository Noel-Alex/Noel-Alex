 <rect x="871" y="35" width="42" height="42" fill="#efe3a9"/><rect x="871" y="35" width="11" height="11" fill="#d2c791"/><rect x="902" y="55" width="11" height="11" fill="#d2c791"/>
</g>
<g class="cloud1" fill="#35505a" opacity=".66"><rect x="651" y="75" width="92" height="12"/><rect x="671" y="63" width="48" height="12"/><rect x="687" y="57" width="28" height="6"/></g>
<g class="cloud2" fill="#2d4650" opacity=".52"><rect x="811" y="126" width="76" height="10"/><rect x="828" y="116" width="37" height="10"/></g>
<text x="42" y="53" fill="#9fb58d" font-size="14">NOEL-ALEX // SURVIVAL ENGINEER · AI SYSTEMS · DISTRIBUTED INFRA · SEARCH</text>
<text x="42" y="119" fill="#f4f1db" font-size="55" font-weight="700">NOEL ALEX</text>
<text x="42" y="162" fill="#e8c75f" font-size="20">&gt; mine assumptions. measure everything. ship the build.</text>
<text x="42" y="205" fill="#c9d3be" font-size="16">I build ambitious systems that stay inspectable when they get messy:</text>
<text x="42" y="231" fill="#c9d3be" font-size="16">research tooling · distributed systems · retrieval · applied ML.</text>
<path d="M42 279H593" stroke="#4d6452" stroke-width="1"/>
<text x="42" y="310" fill="#9fb58d" font-size="13">WORLD // VIT VELLORE · B.TECH CSE (DATA SCIENCE) · CLASS OF 2027</text>
<text x="42" y="336" fill="#c9d3be" font-size="13">CURRENT BIOMES // EVIDENCE-GROUNDED AI · RUST SYSTEMS · SEARCH / RETRIEVAL</text>
<text x="42" y="365" fill="#758b76" font-size="11">profile save loaded</text><rect class="cursor" x="165" y="354" width="7" height="12" fill="#e8c75f"/>
